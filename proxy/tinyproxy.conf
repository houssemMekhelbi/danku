Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Notice
MaxClients 64
# Only CONNECT to these ports. ai rewrites this list per session: 443 plus <project>/.ai/ports.
ConnectPort 443
# Deny by default; allowlist is bind-mounted at runtime (see ../ai).
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterDefaultDeny Yes
FilterURLs No
ViaProxyName "ai-proxy"
DisableViaHeader Yes
